name: CI

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required for repository checkout
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
        with:
          version: 7
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Build
        run: |
          pnpm run docs:build || { echo "Build failed"; exit 1; }
      - name: Check build output  # Debug build output
        run: |
          ls -la docs/.vitepress/dist || echo "No build output found!"   
      - uses: actions/configure-pages@v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist
      - name: Check artifact upload  # Debug artifact contents before upload
        run: |
          echo "Checking if artifact exists..."
          ls -la docs/.vitepress/dist || echo "Directory is empty or missing!"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
